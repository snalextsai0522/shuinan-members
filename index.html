<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國際佛光會中華總會中一區水湳分會-會員分組一覽表</title>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: #fdfbf5;
            color: #111111;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #731e0f;
            color: #ffffff;
            text-align: center;
            padding: 26px 15px 20px 15px;
            border-bottom: 5px solid #b48214;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.1rem;
            margin: 0 0 10px 0;
            font-weight: bold;
            line-height: 1.3;
        }

        .motto {
            font-size: 1.2rem;
            color: #f7d277;
            margin: 0;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .intro {
            text-align: center;
            font-size: 1.15rem;
            color: #665544;
            padding: 14px 10px;
            font-weight: bold;
        }

        .status-bar {
            text-align: center;
            font-size: 0.95rem;
            color: #887766;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 10px 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #ffffff;
            border: 3px solid #cdb98c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.06);
        }

        .card-header {
            background-color: #f2e9d4;
            color: #731e0f;
            padding: 14px;
            font-size: 1.55rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 3px solid #cdb98c;
            letter-spacing: 1px;
        }

        .card-body {
            padding: 18px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 8px;
        }

        .member {
            font-size: 1.45rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .num {
            color: #8c5020;
            margin-right: 6px;
            font-size: 1.25rem;
            font-weight: normal;
            display: inline-block;
            width: 28px;
            text-align: right;
        }

        .name-text {
            color: #111111;
        }

        .name-link {
            color: #8f2c15;
            text-decoration: underline;
            text-decoration-thickness: 2.5px;
            text-underline-offset: 4px;
            cursor: pointer;
        }

        .name-link::after {
            content: "🧾";
            font-size: 0.9rem;
            margin-left: 4px;
            display: inline-block;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background-color: #ffffff;
            border: 4px solid #b48214;
            border-radius: 16px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .receipt-card {
            border: 2px solid #cdb98c;
            background-color: #fffdf9;
            border-radius: 10px;
            padding: 16px;
            margin-top: 15px;
            text-align: left;
        }

        .receipt-header-info {
            font-size: 1.3rem;
            font-weight: bold;
            color: #731e0f;
            border-bottom: 2px solid #e8e2d5;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .year-record {
            background-color: #ffffff;
            border: 1px solid #e0d8c3;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .year-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-paid {
            color: #2e7d32;
            font-size: 1.05rem;
        }

        .status-unpaid {
            color: #888888;
            font-size: 1.05rem;
        }

        .receipt-detail {
            font-size: 1.05rem;
            color: #555555;
            margin-top: 6px;
            word-break: break-all;
        }

        .photo-btn {
            display: inline-block;
            background-color: #731e0f;
            color: #f7d277;
            padding: 4px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95rem;
            margin-top: 6px;
            font-weight: bold;
        }

        .photo-btn:hover {
            background-color: #b48214;
            color: #ffffff;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: #731e0f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 40px;
            text-align: center;
        }

        .close-btn:hover {
            background: #b48214;
        }

        .blessing-card {
            background-color: #fff9eb;
            border: 3px dashed #b48214;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            border-radius: 12px;
        }

        .blessing-text {
            font-size: 1.6rem;
            color: #731e0f;
            font-weight: bold;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 35px 15px;
            color: #666666;
            font-size: 1.05rem;
            border-top: 1px solid #e2ded5;
            margin-top: 40px;
            background-color: #f7f5f0;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.6rem; }
            .motto { font-size: 0.95rem; }
            .card-header { font-size: 1.4rem; }
            .member { font-size: 1.35rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>國際佛光會中華總會中一區水湳分會<br>會員分組一覽表</h1>
        <p class="motto">◎ 佛光普照 法水長流 ｜ 歡喜同行 同圓種智 ◎</p>
    </header>

    <div class="intro">
        ※ 姓名帶有 🧾 標籤者表示已有 2027 年度繳費紀錄，點擊名字可查閱繳費證明！ ※
    </div>
    <div id="status-bar" class="status-bar">資料同步中...</div>

    <div class="container" id="groups-container">
        <!-- 分組名單動態渲染 -->
    </div>

    <!-- 繳費紀錄彈窗 -->
    <div id="receipt-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div style="font-size:1.5rem; color:#731e0f; font-weight:bold; text-align:center;">2027 年度繳費紀錄證明</div>
            
            <div class="receipt-card">
                <div class="receipt-header-info">
                    <span id="receipt-group"></span> ‧ <span id="receipt-name"></span> 會員
                </div>
                <div id="records-list">
                    <!-- 動態帶入紀錄 -->
                </div>
            </div>

            <p style="margin-top: 15px; color: #666; font-size: 0.95rem; text-align:center;">（點選右上方 ✕ 或點擊背景任意處可關閉）</p>
        </div>
    </div>

    <footer>
        <p>※ 本表依據水湳分會會員名冊彙編製成 ※</p>
        <p>祝各位會員 吉祥如意 ‧ 平安法喜 ‧ 闔家平安</p>
    </footer>

    <script>
        const SHEET_ID = '1hgDVzXdVWF8jyB3uok9sZrlN4Dc14CFFpnUR5BBxvmE';
        let allMembersData = {};

        const fallbackData = {
            "第一組": [
                { name: "王惠玉", "2027": "27-0005" },
                { name: "李興農", "2027": "" },
                { name: "陳葉", "2027": "" },
                { name: "翁秀月", "2027": "" },
                { name: "楊春棗", "2027": "27-0012" },
                { name: "張秀祝", "2027": "" },
                { name: "蔡曉梅", "2027": "" },
                { name: "林敬堯", "2027": "" },
                { name: "何依鈴", "2027": "" },
                { name: "黃菳棠", "2027": "27-0001" },
                { name: "蔡勝男", "2027": "" },
                { name: "王福義", "2027": "" },
                { name: "盧采絨", "2027": "" },
                { name: "郭秋蘭", "2027": "27-0020" }
            ],
            "第七組": [
                { name: "鄭素蘭", "2027": "" },
                { name: "耿智光", "2027": "" },
                { name: "耿智秋", "2027": "" },
                { name: "耿智琳", "2027": "" },
                { name: "林俊孝", "2027": "" },
                { name: "程慕洵", "2027": "" },
                { name: "賴姿蓉", "2027": "" },
                { name: "徐桂英", "2027": "" },
                { name: "蔣月鳳", "2027": "" },
                { name: "何玉佩", "2027": "" },
                { name: "林秀真", "2027": "" },
                { name: "吳佳穎", "2027": "" },
                { name: "林春成", "2027": "" },
                { name: "江茂亮", "2027": "0002761901" },
                { name: "蕭立華", "2027": "" },
                { name: "林瓊瑤", "2027": "" },
                { name: "蔡慧娟", "2027": "" },
                { name: "詹勝雄", "2027": "" },
                { name: "吳湘鈞", "2027": "" },
                { name: "吳宜臻", "2027": "" }
            ]
        };

        const EXTENSIONS = ['.jpg', '.JPG', '.jpeg', '.JPEG', '.png', '.PNG'];

        function findReceiptImage(year, memberName, callback) {
            let index = 0;
            function tryNext() {
                if (index >= EXTENSIONS.length) {
                    callback(null);
                    return;
                }
                const ext = EXTENSIONS[index++];
                const testPath = `https://raw.githubusercontent.com/snalextsai0522/shuinan-members/main/receipts/${year}-${memberName}${ext}`;
                const img = new Image();
                img.src = testPath;
                img.onload = function() {
                    callback(testPath);
                };
                img.onerror = function() {
                    tryNext();
                };
            }
            tryNext();
        }

        function render(groups) {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            Object.keys(groups).forEach(groupName => {
                const members = groups[groupName];
                const card = document.createElement('div');
                card.className = 'card';

                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerText = `【 ${groupName} 】 (${members.length}人)`;
                card.appendChild(header);

                const body = document.createElement('div');
                body.className = 'card-body';

                members.forEach((m, idx) => {
                    const seqNum = idx + 1;
                    // 只檢查 2027 年是否有繳費紀錄
                    const has2027Record = m["2027"] && m["2027"].trim() !== "";

                    const memberDiv = document.createElement('div');
                    memberDiv.className = 'member';

                    if (has2027Record) {
                        const memberDataStr = encodeURIComponent(JSON.stringify(m));
                        memberDiv.innerHTML = `
                            <span class="num">${seqNum}.</span>
                            <span class="name-link" onclick="openModal('${groupName}', '${memberDataStr}')">${m.name}</span>
                        `;
                    } else {
                        memberDiv.innerHTML = `
                            <span class="num">${seqNum}.</span><span class="name-text">${m.name}</span>
                        `;
                    }
                    body.appendChild(memberDiv);
                });

                card.appendChild(body);
                container.appendChild(card);
            });

            const blessingCard = document.createElement('div');
            blessingCard.className = 'blessing-card';
            blessingCard.innerHTML = `
                <div class="blessing-text">
                    🌸 身心自在<br>福慧增長 🌸<br>
                    <span style="font-size: 1.25rem; color: #b48214;">水湳分會全體敬祝</span>
                </div>
            `;
            container.appendChild(blessingCard);
        }

        function openModal(groupName, memberDataStr) {
            const member = JSON.parse(decodeURIComponent(memberDataStr));
            document.getElementById('receipt-group').innerText = groupName;
            document.getElementById('receipt-name').innerText = member.name;

            const recordsList = document.getElementById('records-list');
            recordsList.innerHTML = '';

            const recNo = member["2027"] ? member["2027"].trim() : "";
            const recordDiv = document.createElement('div');
            recordDiv.className = 'year-record';

            if (recNo !== "") {
                const photoBtnId = `btn-2027-${encodeURIComponent(member.name)}`;
                recordDiv.innerHTML = `
                    <div class="year-title">
                        <span>2027 年度</span>
                        <span class="status-paid">已繳納 ✓</span>
                    </div>
                    <div class="receipt-detail">單據編號：<strong>${recNo}</strong></div>
                    <a id="${photoBtnId}" class="photo-btn" target="_blank" style="display:none;">📷 查看收據照片</a>
                `;

                findReceiptImage("2027", member.name, function(validPath) {
                    if (validPath) {
                        const btn = document.getElementById(photoBtnId);
                        if (btn) {
                            btn.href = validPath;
                            btn.style.display = 'inline-block';
                        }
                    }
                });
            } else {
                recordDiv.innerHTML = `
                    <div class="year-title">
                        <span>2027 年度</span>
                        <span class="status-unpaid">尚未繳納</span>
                    </div>
                `;
            }
            recordsList.appendChild(recordDiv);

            document.getElementById('receipt-modal').style.display = 'flex';
        }

        function closeModal(event) {
            if (event && event.target && event.target.id !== 'receipt-modal' && !event.target.classList.contains('close-btn')) {
                return;
            }
            document.getElementById('receipt-modal').style.display = 'none';
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        async function loadData() {
            allMembersData = fallbackData;
            render(allMembersData);

            if (!SHEET_ID || SHEET_ID === 'YOUR_SPREADSHEET_ID_HERE') {
                document.getElementById('status-bar').innerText = "提示：目前顯示預設離線名冊。";
                return;
            }

            const timestamp = new Date().getTime();
            const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&t=${timestamp}`;

            try {
                const res = await fetch(gvizUrl);
                if (!res.ok) throw new Error("網路連線異常");
                const rawText = await res.text();

                const jsonMatch = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
                if (!jsonMatch || !jsonMatch[1]) throw new Error("格式解析失敗");

                const data = JSON.parse(jsonMatch[1]);
                const rows = data.table.rows;
                const dynamicGroups = {};

                rows.forEach(row => {
                    if (!row.c) return;
                    const groupVal = row.c[0] ? (row.c[0].v || "").toString().trim() : "";
                    const nameVal = row.c[2] ? row.c[2].v.toString().trim() : (row.c[1] ? row.c[1].v.toString().trim() : "");
                    // 只取 2027 年的繳費編號（根據你的 Google Sheet 欄位位置調整）
                    // 預設：c[4] 為 2027 年，c[3] 為 2026 年
                    const r2027 = row.c[4] ? (row.c[4].v || "").toString().trim() : "";

                    if (!groupVal || !nameVal || groupVal.includes("組別") || nameVal.includes("姓名")) return;

                    if (!dynamicGroups[groupVal]) dynamicGroups[groupVal] = [];
                    dynamicGroups[groupVal].push({
                        name: nameVal,
                        "2027": r2027
                    });
                });

                if (Object.keys(dynamicGroups).length > 0) {
                    allMembersData = dynamicGroups;
                    render(allMembersData);
                    document.getElementById('status-bar').innerText = `● 資料已即時同步（最後更新時間：${new Date().toLocaleTimeString()}）`;
                }
            } catch (err) {
                console.warn("無法取得線上試算表，維持顯示內建名冊：", err);
                document.getElementById('status-bar').innerText = "提示：讀取線上試算表失敗，已自動切換為離線名冊。";
            }
        }

        loadData();
    </script>
</body>
</html>
