<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年國際佛光會中華總會中一區水湳分會-會員分組一覽表</title>
    <style>
        /* 佛教雅緻風格 & 老人老花眼友善（極大字、高對比）*/
        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
            background-color: #fdfbf5;
            color: #111111;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #731e0f;
            color: #ffffff;
            text-align: center;
            padding: 30px 15px;
            border-bottom: 5px solid #b48214;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            font-weight: bold;
            line-height: 1.3;
        }

        .motto {
            font-size: 1.25rem;
            color: #f7d277;
            margin: 0;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .intro {
            text-align: center;
            font-size: 1.2rem;
            color: #555555;
            padding: 20px 10px;
            font-weight: bold;
        }

        /* 響應式網格 (RWD) */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #ffffff;
            border: 3px solid #cdb98c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-header {
            background-color: #f2e9d4;
            color: #73230f;
            padding: 15px;
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 3px solid #cdb98c;
        }

        .card-body {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 左右雙排 */
            gap: 15px 10px;
        }

        .member {
            font-size: 1.5rem; /* 字體再放大！列印與手機看都極為清晰 */
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .num {
            color: #8c5020;
            margin-right: 8px;
            font-size: 1.3rem;
            font-weight: normal;
            display: inline-block;
            width: 30px;
            text-align: right;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.5rem;
            color: #731e0f;
            padding: 40px;
            font-weight: bold;
        }

        .blessing-card {
            background-color: #fff9eb;
            border: 3px dashed #b48214;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            border-radius: 12px;
        }

        .blessing-text {
            font-size: 1.6rem;
            color: #731e0f;
            font-weight: bold;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 40px 15px;
            color: #555555;
            font-size: 1.1rem;
            border-top: 1px solid #e0e0e0;
            margin-top: 40px;
            background-color: #f7f5f0;
        }
    </style>
</head>
<body>

    <header>
        <h1>2026年國際佛光會中華總會中一區水湳分會<br>會員分組一覽表</h1>
        <p class="motto">◎ 佛光普照 法水長流 ｜ 歡喜同行 同圓種智 ◎</p>
    </header>

    <div class="intro">
        ※ 各位長輩與會員，您可以用手指在手機螢幕上「放大」觀看您的組別！ ※
    </div>

    <div class="container" id="groups-container">
        <div class="loading">正在即時讀取最新會員名冊，請稍候...</div>
    </div>

    <footer>
        <p>※ 本表依據水湳分會會員名冊彙編製成 ※</p>
        <p>祝各位會員 吉祥如意 ‧ 平安法喜 ‧ 闔家平安</p>
    </footer>

    <script>
        // 【在這裡替換成您自己的 Google 試算表 ID】
        const SHEET_ID = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShBVWbbjqU0MDbY4xyh96haAAEsda4xXjmfD3oMIkOiL172-Wjv7HIk2Xs-gq-cksfHmXMxDu5w72i/pubhtml'; 
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        // 即時抓取試算表，並解析生成高對比、超大字 HTML
        async function fetchAndRenderData() {
            try {
                const response = await fetch(SHEET_URL);
                const csvData = await response.text();
                const lines = csvData.split('\n').map(line => 
                    line.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim())
                );

                // 解析分組資料 (A:組別, B:序號, C:姓名)
                const groups = {};
                for (let i = 1; i < lines.length; i++) {
                    const [group, num, name] = lines[i];
                    if (!group || !name) continue;
                    if (!groups[group]) groups[group] = [];
                    groups[group].push({ num, name });
                }

                const container = document.getElementById('groups-container');
                container.innerHTML = ''; // 移除 loading 字樣

                // 產生每組的卡片
                Object.keys(groups).forEach(groupName => {
                    const members = groups[groupName];
                    
                    const card = document.createElement('div');
                    card.className = 'card';

                    const header = document.createElement('div');
                    header.className = 'card-header';
                    header.innerText = `${groupName} (${members.length}人)`;
                    card.appendChild(header);

                    const body = document.createElement('div');
                    body.className = 'card-body';

                    members.forEach(m => {
                        const memberDiv = document.createElement('div');
                        memberDiv.className = 'member';
                        memberDiv.innerHTML = `<span class="num">${m.num}.</span>${m.name}`;
                        body.appendChild(memberDiv);
                    });

                    card.appendChild(body);
                    container.appendChild(card);
                });

                // 補上最後的福慧增長祝福卡
                const blessingCard = document.createElement('div');
                blessingCard.className = 'blessing-card';
                blessingCard.innerHTML = `
                    <div class="blessing-text">
                        🌸 身心自在<br>福慧增長 🌸<br>
                        <span style="font-size: 1.25rem; color: #b48214;">水湳分會全體敬祝</span>
                    </div>
                `;
                container.appendChild(blessingCard);

            } catch (error) {
                console.error("載入失敗：", error);
                document.getElementById('groups-container').innerHTML = 
                    `<div class="loading" style="color: red;">讀取名冊失敗，請確認網路連線或稍後再試。</div>`;
            }
        }

        fetchAndRenderData();
    </script>
</body>
</html>
