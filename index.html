            "第十八組": ["黃淑清", "吳秉勳", "吳俊億", "林洪阿好", "林李鳳抱", "張瑞珠", "劉月森", "蔡紅枝", "許世芳", "徐寧", "林素月", "葉韋君", "鄭如惠"],
            "第十九組": ["譚莉", "張宇文", "張宇昇", "曾婉婷", "徐振筠", "詹沐澄", "李美惠", "李佩芬", "鍾淑芬", "張容溱"]
        };

        function render(groups) {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            Object.keys(groups).forEach(groupName => {
                const members = groups[groupName];
                const card = document.createElement('div');
                card.className = 'card';

                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerText = `【 ${groupName} 】 (${members.length}人)`;
                card.appendChild(header);

                const body = document.createElement('div');
                body.className = 'card-body';

                members.forEach((name, idx) => {
                    const memberDiv = document.createElement('div');
                    memberDiv.className = 'member';
                    memberDiv.innerHTML = `<span class="num">${idx + 1}.</span>${name}`;
                    body.appendChild(memberDiv);
                });

                card.appendChild(body);
                container.appendChild(card);
            });

            const blessingCard = document.createElement('div');
            blessingCard.className = 'blessing-card';
            blessingCard.innerHTML = `
                <div class="blessing-text">
                    🌸 身心自在<br>福慧增長 🌸<br>
                    <span style="font-size: 1.25rem; color: #b48214;">水湳分會全體敬祝</span>
                </div>
            `;
            container.appendChild(blessingCard);
        }

        // 動態即時同步函式（無 CORS 阻擋）
        async function loadData() {
            render(fallbackData);

            if (!SHEET_ID || SHEET_ID === 'YOUR_SPREADSHEET_ID_HERE') {
                document.getElementById('status-bar').innerText = "提示：目前顯示預設離線名冊（尚未設定試算表 ID）";
                return;
            }

            // 加上時間戳記避免瀏覽器快取舊資料
            const timestamp = new Date().getTime();
            const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&t=${timestamp}`;

            try {
                const res = await fetch(gvizUrl);
                if (!res.ok) throw new Error("網路連線異常");
                const rawText = await res.text();

                // 移除 Google GViz 包裝字樣，精確截取 JSON 字串
                const jsonMatch = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
                if (!jsonMatch || !jsonMatch[1]) {
                    throw new Error("試算表回傳格式錯誤，請確認已設定『知道連結的任何人均可檢視』");
                }

                const data = JSON.parse(jsonMatch[1]);
                const rows = data.table.rows;
                const dynamicGroups = {};

                rows.forEach(row => {
                    if (!row.c) return;
                    // A欄位(c[0]): 組別；C欄位(c[2])或B欄位(c[1]): 姓名
                    const groupVal = row.c[0] ? (row.c[0].v || "").toString().trim() : "";
                    let nameVal = "";

                    if (row.c[2] && row.c[2].v) {
                        nameVal = row.c[2].v.toString().trim();
                    } else if (row.c[1] && row.c[1].v) {
                        nameVal = row.c[1].v.toString().trim();
                    }

                    // 略過標題列（如包含「組別」或「姓名」字樣）
                    if (!groupVal || !nameVal || groupVal.includes("組別") || nameVal.includes("姓名")) return;

                    if (!dynamicGroups[groupVal]) dynamicGroups[groupVal] = [];
                    dynamicGroups[groupVal].push(nameVal);
                });

                if (Object.keys(dynamicGroups).length > 0) {
                    render(dynamicGroups);
                    document.getElementById('status-bar').innerText = `● 資料已即時同步（最後更新時間：${new Date().toLocaleTimeString()}）`;
                } else {
                    document.getElementById('status-bar').innerText = "提示：試算表內無有效名單資料，維持預設名冊。";
                }
            } catch (err) {
                console.warn("無法取得線上試算表，維持顯示內建名冊：", err);
                document.getElementById('status-bar').innerText = "提示：讀取線上試算表失敗，已自動切換為離線名冊。";
            }
        }

        loadData();
    </script>
